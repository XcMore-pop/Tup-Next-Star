<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PARTY MANAGEMENT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main id="loginView" class="login-wrap">
    <section class="login-card">
      <div class="brand-mark"><i class="fa-solid fa-shield-halved"></i></div>
      <p class="eyebrow">MEMBER MANAGEMENT SYSTEM</p>
      <h1>PARTY MANAGEMENT</h1>
      <p class="muted">ระบบบริหารจัดการสมาชิกพรรค</p>
      <form id="loginForm">
        <label>ชื่อผู้ใช้</label>
        <input id="username" autocomplete="username" required placeholder="Username">
        <label>รหัสผ่าน</label>
        <input id="password" type="password" autocomplete="current-password" required placeholder="Password">
        <button class="btn primary full" type="submit">เข้าสู่ระบบ <i class="fa-solid fa-arrow-right"></i></button>
      </form>
      <p id="loginError" class="error"></p>
      <small class="muted">ระบบสำหรับสมาชิกและคณะกรรมการพรรค</small>
    </section>
  </main>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand"><span class="brand-mark small"><i class="fa-solid fa-shield-halved"></i></span><div><b>PARTY</b><small>MANAGEMENT</small></div></div>
      <nav id="mainNav">
        <div class="nav-caption admin-only">เมนูผู้ดูแลระบบ</div>
        <button class="nav-link admin-only" data-page="dashboard"><i class="fa-solid fa-chart-pie"></i> ภาพรวม</button>
        <button class="nav-link admin-only" data-page="members"><i class="fa-solid fa-users"></i> สมาชิก</button>
        <button class="nav-link admin-only" data-page="attendance"><i class="fa-solid fa-calendar-check"></i> ระบบเช็กชื่อ</button>
        <button class="nav-link admin-only" data-page="behavior"><i class="fa-solid fa-award"></i> คะแนนความประพฤติ</button>
        <button class="nav-link admin-only" data-page="appeals" id="appealsNav"><i class="fa-solid fa-scale-balanced"></i> ตรวจคำอุทธรณ์</button>
        <button class="nav-link admin-only" data-page="userManagement" id="userManagementNav"><i class="fa-solid fa-users-gear"></i> จัดการบัญชี</button>
        <div class="nav-caption member-only">พื้นที่สมาชิก</div>
        <button class="nav-link member-only" data-page="memberPortal"><i class="fa-solid fa-house-user"></i> ภาพรวมของฉัน</button>
        <button class="nav-link member-only" data-page="myAttendance"><i class="fa-solid fa-calendar-check"></i> ประวัติการเช็กชื่อ</button>
        <button class="nav-link member-only" data-page="myBehavior"><i class="fa-solid fa-award"></i> คะแนนความประพฤติ</button>
        <button class="nav-link member-only" data-page="myAppeals"><i class="fa-solid fa-scale-balanced"></i> คำอุทธรณ์ของฉัน</button>
        <div class="nav-caption">บัญชี</div>
        <button class="nav-link" data-page="account"><i class="fa-solid fa-user-gear"></i> บัญชีของฉัน</button>
      </nav>
      <div class="side-bottom"><div class="user-mini"><div class="avatar" id="avatar">A</div><div><b id="userName">ผู้ใช้งาน</b><small id="userRole">MEMBER</small></div></div><button id="logoutBtn" class="logout"><i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ</button></div>
    </aside>
    <section class="main-area">
      <header class="topbar"><div><span class="muted">PARTY MANAGEMENT /</span> <b id="pageTitle">ภาพรวม</b></div><span class="top-date" id="today"></span></header>
      <div id="pageContent" class="content"></div>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
